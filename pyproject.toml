[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencelock"
version = "0.1.0"
description = "Revision-aware evidence grounding research pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.2", "curatorkit==0.1.22", "auditkit==1.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.3"]

[project.scripts]
evidencelock = "evidencelock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
